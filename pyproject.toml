[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feln-clm"
version = "0.1.0"
description = "Text to FELN with a LoRA-tuned Qwen3, decoding constrained to an OKF catalog"
requires-python = ">=3.12"
dependencies = ["feln", "numpy"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]
exec = ["duckdb>=1.1"]
train = ["torch", "transformers>=5", "safetensors"]  # v5: DynamicCache.reorder_cache  # CUDA host only
dev = ["pytest", "ruff"]

[project.scripts]
feln-clm = "feln_clm.cli:main"

[tool.uv]
environments = ["sys_platform == 'darwin'"]  # the CUDA host installs with `uv pip` (README)

[tool.uv.sources]
feln = { path = "../feln", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
