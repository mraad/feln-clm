[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feln-clm"
version = "0.1.0"
description = "Text to FELN with a fine-tuned Contrastive Language Model over an OKF catalog"
requires-python = ">=3.12"
dependencies = ["contrastive-lm", "feln", "numpy", "pyarrow", "torch"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]
exec = ["duckdb>=1.1"]
dev = ["pytest", "ruff"]

[project.scripts]
feln-clm = "feln_clm.cli:main"

[tool.uv]
# CLM pins vLLM (Linux + CUDA); here it only supplies schema/heads/engine. The remote
# trainer installs vLLM itself; locally the encoder runs on MLX.
environments = ["sys_platform == 'darwin'"]
override-dependencies = ["vllm ; sys_platform == 'linux'"]

[tool.uv.sources]
contrastive-lm = { path = "../CLM", editable = true }
feln = { path = "../feln", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
